<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" role="img" aria-label="Пчёлка">
  <style>
    .bee { animation: bee-float 2.6s ease-in-out infinite; }
    .wing-l { transform-origin: 96px 112px; animation: flap-l .42s ease-in-out infinite alternate; }
    .wing-r { transform-origin: 132px 118px; animation: flap-r .42s ease-in-out infinite alternate; }
    .ant-l { transform-origin: 78px 48px; animation: ant .9s ease-in-out infinite alternate; }
    .ant-r { transform-origin: 112px 46px; animation: ant .9s ease-in-out infinite alternate-reverse; }
    .needle { transform-origin: 158px 108px; animation: needle 2.6s ease-in-out infinite; }
    @keyframes bee-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes flap-l {
      from { transform: rotate(-6deg) scaleY(1); }
      to { transform: rotate(16deg) scaleY(.62); }
    }
    @keyframes flap-r {
      from { transform: rotate(6deg) scaleY(1); }
      to { transform: rotate(-16deg) scaleY(.62); }
    }
    @keyframes ant {
      from { transform: rotate(-8deg); }
      to { transform: rotate(10deg); }
    }
    @keyframes needle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bee, .wing-l, .wing-r, .ant-l, .ant-r, .needle { animation: none; }
    }
  </style>
  <g class="bee" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <g class="wing-l" fill="#fff6cf">
      <path d="M96 108 C62 92 34 112 40 154 C46 190 86 184 104 156 C112 140 112 120 96 108Z"/>
      <path d="M78 124 C64 138 62 160 74 172" stroke="#f0d48a" stroke-width="3"/>
    </g>
    <g class="wing-r" fill="#fff6cf">
      <path d="M132 114 C166 102 196 124 188 162 C180 196 140 188 126 160 C118 144 118 124 132 114Z"/>
      <path d="M150 132 C164 146 162 166 150 176" stroke="#f0d48a" stroke-width="3"/>
    </g>
    <path d="M78 176 C62 198 48 214 36 222" stroke-width="8"/>
    <path d="M78 176 C62 198 48 214 36 222" stroke="#ffc42e" stroke-width="3.5"/>
    <path d="M112 180 C126 204 140 218 156 226" stroke-width="8"/>
    <path d="M112 180 C126 204 140 218 156 226" stroke="#ffc42e" stroke-width="3.5"/>
    <ellipse cx="28" cy="226" rx="16" ry="9" fill="#ffc42e" transform="rotate(-24 28 226)"/>
    <ellipse cx="164" cy="230" rx="16" ry="9" fill="#ffc42e" transform="rotate(18 164 230)"/>
    <g>
      <clipPath id="bee-body"><ellipse cx="96" cy="148" rx="40" ry="52"/></clipPath>
      <g clip-path="url(#bee-body)">
        <rect x="40" y="90" width="120" height="120" fill="#ffc42e" stroke="none"/>
        <rect x="40" y="128" width="120" height="12" fill="#1c1917" stroke="none"/>
        <rect x="40" y="152" width="120" height="12" fill="#1c1917" stroke="none"/>
        <rect x="40" y="176" width="120" height="11" fill="#1c1917" stroke="none"/>
      </g>
      <ellipse cx="96" cy="148" rx="40" ry="52" fill="none"/>
    </g>
    <path d="M68 124 C48 132 34 154 42 170" stroke-width="9"/>
    <path d="M68 124 C48 132 34 154 42 170" stroke="#ffc42e" stroke-width="4"/>
    <ellipse cx="40" cy="176" rx="11" ry="9" fill="#ffc42e" transform="rotate(-16 40 176)"/>
    <path d="M122 118 C142 112 158 104 164 112" stroke-width="9"/>
    <path d="M122 118 C142 112 158 104 164 112" stroke="#ffc42e" stroke-width="4"/>
    <g class="needle">
      <polygon points="158,18 152,40 164,40" fill="#1c1917" stroke="none"/>
      <path d="M158 36 V188" stroke="#1c1917" stroke-width="7"/>
      <path d="M158 42 V184" stroke="#f7f4ee" stroke-width="2.6"/>
      <ellipse cx="158" cy="198" rx="11" ry="16" fill="#f7f4ee"/>
      <ellipse cx="158" cy="198" rx="4" ry="8" fill="none" stroke-width="3"/>
      <ellipse cx="164" cy="112" rx="12" ry="11" fill="#ffc42e"/>
    </g>
    <ellipse cx="96" cy="78" rx="36" ry="34" fill="#ffc42e"/>
    <g class="ant-l">
      <path d="M78 50 C70 32 58 24 64 12" stroke-width="4"/>
      <circle cx="64" cy="10" r="5" fill="#1c1917" stroke="none"/>
    </g>
    <g class="ant-r">
      <path d="M112 48 C122 30 136 22 130 10" stroke-width="4"/>
      <circle cx="130" cy="8" r="5" fill="#1c1917" stroke="none"/>
    </g>
    <ellipse cx="80" cy="76" rx="10" ry="12" fill="#fff"/>
    <ellipse cx="114" cy="74" rx="10" ry="12" fill="#fff"/>
    <circle cx="82" cy="78" r="4.2" fill="#1c1917" stroke="none"/>
    <circle cx="116" cy="76" r="4.2" fill="#1c1917" stroke="none"/>
    <circle cx="83.6" cy="76.4" r="1.4" fill="#fff" stroke="none"/>
    <circle cx="117.6" cy="74.4" r="1.4" fill="#fff" stroke="none"/>
    <path d="M84 94 Q96 104 110 92" stroke-width="3.4"/>
    <ellipse cx="66" cy="90" rx="7" ry="4" fill="#ffb4a2" stroke="none" opacity=".9"/>
    <ellipse cx="126" cy="88" rx="7" ry="4" fill="#ffb4a2" stroke="none" opacity=".9"/>
  </g>
</svg>
